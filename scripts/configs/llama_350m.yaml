seed: 42
name: llama_350m
training_mode: vanilla
num_total_iters: 62250
num_freq: 25
gradient: coupled
is_asyn: false
is_init: false
is_wandb: true
is_monitor: true
save_interval: 1
is_clip: !!float '1'
max_length: 256
seed_for_shuffle: 42
batch_size: 512
num_workers: 0
scheduler:
  name: cosine
  params:
    warmup_steps: 2200
    min_lr_ratio: 0.1
optimizer:
  name: AdamW
  params:
    lr: 0.001
    betas:
    - 0.9
    - 0.95
    eps: 0.00000001
    weight_decay: !!float '0'
layers:
- name: embed_tokens
  params:
    energy: 0.999
    init_energy: 0.45
    is_init: false
    iter_max: 1
    tol: 0.001
    rate_rank: 0.15
    rate_sparsity: 0.05
    alpha_dict:
      init: !!float '0'
      mode: adaptive
      rate_decay: 0.2
      drate: !!float '1'
    beta_dict:
      init: !!float '0'
      mode: adaptive
      rate_decay: 0.0013
      drate: 0.01
    rho_dict:
      rho: 0.0000003
      mode: fixed
      start_epoch: 2
      coeff_rho: 0.1
      coeff_rho_min: 0.01
      coeff_rho_max: !!float '1500'
      rho_rate: !!float '1'

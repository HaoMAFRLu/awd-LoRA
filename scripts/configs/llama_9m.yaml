seed: 42
num_total_iters: 200000
num_freq: 10
is_clip: !!float '1'
max_length: 256
seed_for_shuffle: 42
batch_size: 2
num_workers: 2
scheduler:
  name: cosine
  params:
    warmup_steps: 1000
    min_lr_ratio: 0.1
optimizer:
  name: AdamW

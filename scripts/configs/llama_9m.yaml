    beta_to_rho: 0.001
    rho: 0.001
    energy: 0.9
    init_energy: 0.3
    iter_max: 1
    tol: 0.001
    loss_version: v1
    is_cal: false
    rate_rank: 0.15
    rate_sparsity: 0.1
    is_adaptive: true
    rate_decay: 25

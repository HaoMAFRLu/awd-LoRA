seed: 43
seed_for_shuffle: 43

tokenizer_name: t5-base
max_length: 256
precision: bfloat16

data:
  type: text
  name: allenai/c4
  subset: en
  split: validation
  streaming: true

# Short, paired diagnostic: every condition reuses these exact cached batches.
batch_size: 512
num_eval_batches: 32
num_workers: 0

evaluation_mode: loop_projection
checkpoints:
  vanilla:
    model_config: configs/llama_60m_model.json
    checkpoint: data/looped_transformer/llama_vanilla_60m/20260813_184120/model.pth
  looped:
    model_config: configs/llama_looped_60m_model.json
    checkpoint: data/looped_transformer/llama_looped_60m_contraction_w1/20260815_115625/model.pth

loop_values: [1, 2, 3, 4, 5, 6, 8, 10, 12, 15, 20]

loop_projection:
  enabled: true
  include_vanilla: true
  gammas: [0.5, 0.8, 0.9, 0.95]

distance_monitor:
  enabled: true
  num_loops: 20
  gamma: 0.8

output_directory: data/looped_transformer/evaluation/c4_seed43_contraction_w1_projection

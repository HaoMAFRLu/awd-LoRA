seed: 42

task:
  name: classification
  head: linear
  num_classes: 1000

model:
  name: dino_vitb8
  variant: teacher
  checkpoint: data/salaad_vision/pretrained/dino_vitbase8_pretrain.pth
  checkpoint_kind: teacher_backbone
  freeze: true

data:
  name: imagenet
  dataset: ILSVRC/imagenet-1k
  location: cluster_snapshot
  root: /lustre/fast/fast/hma2/data/imagenet2012/hf_cache/hub/datasets--ILSVRC--imagenet-1k/snapshots/49e2ee26f3810fb5a7536bbf732a7b07389a47b5
  cache_dir: /lustre/home/hma2/hf/datasets
  streaming: true
  pin_memory: true
  train:
    split: train
    shuffle: true
    shuffle_buffer_size: 10000
    drop_last: true
  validation:
    split: validation
    shuffle: false
    drop_last: false

training:
  epochs: 1
  batch_size: 768
  num_workers: 2
  precision: float32
  max_steps_per_epoch: 50

validation:
  max_steps: 20

optimizer:
  name: sgd
  lr: 0.002
  momentum: 0.9
  weight_decay: 0.0

scheduler:
  name: cosine
  min_lr: 0.00001

wandb:
  enabled: true
  project: SALAAD_VISION_DOWNSTREAM
  entity: hao-ma-eth-z-rich
  group: imagenet_linear_probe_h10080_cluster_smoke
  job_type: linear_probe

runtime:
  device: cuda
  distributed: true
  backend: nccl

output:
  save: true
  dir: data/salaad_vision/downstream/teacher_h10080_b768_cluster_smoke

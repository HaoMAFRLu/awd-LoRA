seed: 42
name: llama_looped_60m_e10_smoke
model_config: llama_looped_60m_model.json
training_mode: loop
output_folder: looped_transformer_smoke
wandb_project: LOOPED_TRANSFORMER

tokenizer_name: t5-base
data:
  type: text
  name: allenai/c4
  subset: en
  split: train
  streaming: true

num_total_iters: 5
num_freq: 5
is_wandb: false
is_monitor: true
save_interval: 5
is_clip: 1.0
max_length: 256
seed_for_shuffle: 42
batch_size: 512
num_workers: 0

# Exercise the formal run's worst-case activation depth on every smoke step.
loop:
  num_loops: 15
  sampling:
    values: [15]
    probabilities: [1]
    expected_value: 15.0
    seed: 42

soft_tie:
  source_block: layers.0
  target_block: layers.3
  rho: 0.1
  epsilon: 1.0e-12
  parameter_names:
    - self_attn.q_proj.weight
    - self_attn.k_proj.weight
    - self_attn.v_proj.weight
    - self_attn.o_proj.weight
    - mlp.gate_proj.weight
    - mlp.up_proj.weight
    - mlp.down_proj.weight

scheduler:
  name: cosine
  params:
    warmup_steps: 1
    min_lr_ratio: 0.1
optimizer:
  name: AdamW
  params:
    lr: 0.003
    betas:
      - 0.9
      - 0.95
    eps: 1.0e-08
    weight_decay: 0.0

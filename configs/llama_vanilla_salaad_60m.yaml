seed: 42
name: llama_vanilla_salaad_60m
model_config: llama_60m_model.json
training_mode: salad
output_folder: vanilla_salaad
wandb_project: CONSENSUS_SALAAD

tokenizer_name: t5-base
data:
  type: text
  name: allenai/c4
  subset: en
  split: train
  streaming: true

num_total_iters: 11000
num_freq: 20
gradient: coupled
is_asyn: false
is_init: false
is_wandb: true
is_monitor: true
save_interval: 1000
is_clip: 1.0
max_length: 256
seed_for_shuffle: 42

# Global batch size: 128 samples per GPU with four DDP ranks.
batch_size: 512
num_workers: 0

scheduler:
  name: cosine
  params:
    warmup_steps: 2200
    min_lr_ratio: 0.1

optimizer:
  name: AdamW
  params:
    lr: 0.003
    betas: [0.9, 0.95]
    eps: 1.0e-8
    weight_decay: 0.0

# Match the six logical body blocks used by the consensus experiments. The
# entry block (0) and exit block (7) stay dense. Each selected weight follows
# the original SALAAD constraint W = L + S.
layers:
  - name: layers.1.self_attn.q_proj
    params: &attention_params
      energy: 0.999
      init_energy: 0.15
      is_init: false
      iter_max: 1
      tol: 0.001
      rate_rank: 0.15
      rate_sparsity: 0.05
      alpha_dict:
        init: 0.0
        mode: adaptive
        rate_decay: 0.2
        drate: 0.01
        start_epoch: 1500
      beta_dict:
        init: 0.0
        mode: adaptive
        rate_decay: 0.002
        drate: 0.01
        start_epoch: 1500
      rho_dict:
        rho: 1.0e-6
        mode: fixed
  - name: layers.1.self_attn.k_proj
    params:
      <<: *attention_params
  - name: layers.1.self_attn.v_proj
    params:
      <<: *attention_params
  - name: layers.1.self_attn.o_proj
    params:
      <<: *attention_params
  - name: layers.1.mlp.gate_proj
    params: &mlp_params
      energy: 0.999
      init_energy: 0.35
      is_init: false
      iter_max: 1
      tol: 0.001
      rate_rank: 0.15
      rate_sparsity: 0.05
      alpha_dict:
        init: 0.0
        mode: adaptive
        rate_decay: 0.2
        drate: 0.01
        start_epoch: 1500
      beta_dict:
        init: 0.0
        mode: adaptive
        rate_decay: 0.002
        drate: 0.01
        start_epoch: 1500
      rho_dict:
        rho: 1.0e-6
        mode: fixed
  - name: layers.1.mlp.up_proj
    params:
      <<: *mlp_params
  - name: layers.1.mlp.down_proj
    params:
      <<: *mlp_params

  - name: layers.2.self_attn.q_proj
    params:
      <<: *attention_params
  - name: layers.2.self_attn.k_proj
    params:
      <<: *attention_params
  - name: layers.2.self_attn.v_proj
    params:
      <<: *attention_params
  - name: layers.2.self_attn.o_proj
    params:
      <<: *attention_params
  - name: layers.2.mlp.gate_proj
    params:
      <<: *mlp_params
  - name: layers.2.mlp.up_proj
    params:
      <<: *mlp_params
  - name: layers.2.mlp.down_proj
    params:
      <<: *mlp_params

  - name: layers.3.self_attn.q_proj

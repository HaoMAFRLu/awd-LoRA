# Documented five-step ADMM; P/shared/residual/U sweeps at 10, 20, ..., 2100.
inherits: ns97m_aligned.yaml
experiment: moe_ns97m_sinkhorn
salaad:
  state_initialization_step: 0
  residual_mode: dense
  low_rank_enabled: false
  sparse_enabled: false
  controller: null
  structure_order: [permutation, shared, residual, dual]
  initialization: identity_shared_mean_residual_dual_zero
  channel_alignment:
    method: sinkhorn
    fix_reference: false
    match_every_optimizer_steps: 10
    sinkhorn:
      update_rule: closed_form_clip_sinkhorn
      temperature: 1.0
      clip_min: 1.0e-8
      max_iterations: 150
      marginal_tolerance: 1.0e-5

seed: 43
seed_for_shuffle: 43

tokenizer_name: t5-base
max_length: 256
precision: bfloat16

data:
  type: text
  name: allenai/c4
  subset: en
  split: validation
  streaming: true

# Every condition reuses these exact cached batches.
batch_size: 512
num_eval_batches: 250
num_workers: 0

checkpoints:
  - name: vanilla_reference
    model_config: configs/llama_60m_model.json
    checkpoint: data/looped_transformer/llama_vanilla_60m/20260813_184120/model.pth
    physical_depth: 8
    logical_depth: 8
    num_loops: 1
    blocks_per_loop: 0

  - name: loop1_block6
    model_config: configs/llama_consensus_60m_loop1_block6_model.json
    checkpoint: data/consensus_salaad_loop1_block6/llama_consensus_60m_loop1_block6/20260817_174605/model.pth
    physical_depth: 8
    logical_depth: 8
    num_loops: 1
    blocks_per_loop: 6

  - name: loop2_block3
    model_config: configs/llama_consensus_60m_model.json
    checkpoint: data/consensus_salaad/llama_consensus_60m/20260817_173113/model.pth
    physical_depth: 5
    logical_depth: 8
    num_loops: 2
    blocks_per_loop: 3

  - name: loop3_block2
    model_config: configs/llama_consensus_60m_loop3_block2_model.json
    checkpoint: data/consensus_salaad_loop3_block2/llama_consensus_60m_loop3_block2/20260817_174014/model.pth
    physical_depth: 4
    logical_depth: 8
    num_loops: 3
    blocks_per_loop: 2

  - name: loop6_block1
    model_config: configs/llama_consensus_60m_loop6_block1_model.json
    checkpoint: data/consensus_salaad_loop6_block1/llama_consensus_60m_loop6_block1/20260817_173723/model.pth
    physical_depth: 3
    logical_depth: 8
    num_loops: 6
    blocks_per_loop: 1

output_directory: data/consensus_salaad_evaluation/c4_seed43

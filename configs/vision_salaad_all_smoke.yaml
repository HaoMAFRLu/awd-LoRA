seed: 42

task:
  name: classification
  head: linear
  num_classes: 1000

model:
  name: dino_vitb8
  variant: salaad_all
  checkpoint: data/salaad_vision/vit_b8/20260803_114805/model.pth
  checkpoint_kind: student_model
  matrix_dir: data/salaad_vision/vit_b8/20260803_114805
  freeze: true

data:
  name: imagenet
  dataset: ILSVRC/imagenet-1k
  location: local_smoke
  root: data/salaad_vision/smoke/imagenet_val64_parquet
  cache_dir: data/salaad_vision/smoke/imagenet_val64_parquet/cache
  streaming: true
  pin_memory: false
  train:
    split: validation
    shuffle: true
    shuffle_buffer_size: 64
    drop_last: true
  validation:
    split: validation
    shuffle: false
    drop_last: false

training:
  epochs: 3
  batch_size: 2
  num_workers: 0
  precision: float32
  max_steps_per_epoch: 16

validation:
  max_steps: 16

optimizer:
  name: sgd
  lr: 0.001
  momentum: 0.9
  weight_decay: 0.0

scheduler:
  name: cosine
  min_lr: 0.00001

wandb:
  enabled: true
  project: SALAAD_VISION_DOWNSTREAM
  entity: hao-ma-eth-z-rich
  group: imagenet_linear_probe_smoke
  job_type: linear_probe

runtime:
  device: auto
  distributed: auto

output:
  save: true
  dir: data/salaad_vision/downstream/salaad_all_smoke

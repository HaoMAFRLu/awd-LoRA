# Joint SwiGLU channel alignment before shared averaging; native X/L/S/U stay put.
inherits: ns97m.yaml
experiment: moe_ns97m_aligned_consensus
salaad:
  initialization: aligned_shared_mean_L_zero_S_residual_dual_zero
  auxiliary_owner: deterministic_layer_id_mod_dp
  structure_order: [permutation, shared, low_rank, sparse, dual]
  channel_alignment:
    enabled: true
    match_every_optimizer_steps: 100  # Set to 0 for initialization-only alignment.
    initialization_max_iterations: 10
    improvement_tolerance: 1.0e-6
    reference_expert: 0

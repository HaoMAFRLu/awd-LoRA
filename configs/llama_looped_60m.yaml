seed: 42
name: llama_looped_60m
model_config: llama_looped_60m_model.json
training_mode: loop
output_folder: looped_transformer
wandb_project: LOOPED_TRANSFORMER

# Same text pipeline as the existing Llama SALAAD runs, made explicit here.
tokenizer_name: t5-base
data:
  type: text
  name: allenai/c4
  subset: en
  split: train
  streaming: true

num_total_iters: 4
num_freq: 2
is_wandb: true
is_monitor: true
save_interval: 20
is_clip: 1.0
max_length: 256
seed_for_shuffle: 42
batch_size: 2
num_workers: 0

# Training samples one shared depth per optimizer step. The probabilities have
# E[num_loops] = 1*0.4 + 2*0.3 + 3*0.2 + 4*0.1 = 2.0.
loop:
  # Default depth used when sampling is disabled or during evaluation.
  num_loops: 2
  sampling:
    values: [1, 2, 3, 4]
    probabilities: [0.4, 0.3, 0.2, 0.1]
    expected_value: 2.0
    seed: 42

soft_tie:
  source_block: layers.0
  target_block: layers.3
  rho: 0.1
  epsilon: 1.0e-12
  # Only matrices are aligned; the two RMSNorm vectors remain independent.
  parameter_names:
    - self_attn.q_proj.weight
    - self_attn.k_proj.weight
    - self_attn.v_proj.weight
    - self_attn.o_proj.weight
    - mlp.gate_proj.weight
    - mlp.up_proj.weight
    - mlp.down_proj.weight

scheduler:
  name: cosine
  params:
    warmup_steps: 2200
    min_lr_ratio: 0.1
optimizer:
  name: AdamW
  params:
    lr: 0.003
    betas:
      - 0.9
      - 0.95
    eps: 1.0e-08
    weight_decay: 0.0

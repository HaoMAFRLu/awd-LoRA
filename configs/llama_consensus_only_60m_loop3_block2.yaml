seed: 42
name: llama_consensus_only_60m_loop3_block2
model_config: llama_consensus_60m_loop3_block2_model.json
training_mode: consensus
output_folder: consensus_only_loop3_block2
wandb_project: CONSENSUS_SALAAD

tokenizer_name: t5-base
data:
  type: text
  name: allenai/c4
  subset: en
  split: train
  streaming: true

num_total_iters: 11000
num_freq: 20
is_wandb: true
is_monitor: true
save_interval: 1000
is_clip: 1.0
max_length: 256
seed_for_shuffle: 42

# Global batch size: 128 samples per GPU with four DDP ranks.
batch_size: 512
num_workers: 0

# One entry block, a two-block recurrent body executed three times, and one
# exit block (physical depth 4, logical depth 8).
# Each logical loop keeps X_i, while ADMM enforces X_i -> X_hat directly.
# No low-rank or sparse residual components are allocated.
consensus_salaad:
  components: [shared]
  rho: 1.0e-6

scheduler:
  name: cosine
  params:
    warmup_steps: 2200
    min_lr_ratio: 0.1
optimizer:
  name: AdamW
  params:
    lr: 0.003
    betas: [0.9, 0.95]
    eps: 1.0e-8
    weight_decay: 0.0

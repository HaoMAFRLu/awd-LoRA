# Hard P; W -> X -> P -> X_e -> U, with the same identity/mean initialization.
inherits: ns97m_aligned.yaml
experiment: moe_ns97m_hungarian
training:
  weight_decay: 0.0
salaad:
  state_initialization_step: 0
  residual_mode: dense
  low_rank_enabled: false
  sparse_enabled: false
  controller: null
  structure_order: [shared, permutation, residual, dual]
  initialization: identity_shared_mean_residual_dual_zero
  channel_alignment:
    method: hungarian
    fix_reference: false
    match_every_optimizer_steps: 10
    improvement_tolerance: 0.0  # Accept every strict improvement; keep P on ties.

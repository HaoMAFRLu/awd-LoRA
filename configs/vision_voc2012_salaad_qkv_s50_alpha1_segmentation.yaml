seed: 42

task:
  name: semantic_segmentation
  head: linear_upsample
  num_classes: 21
  ignore_index: 255
  boundary_tolerance: 1

model:
  name: dino_vitb8
  variant: derived
  label: salaad_qkv_s50_alpha1
  checkpoint: data/salaad_vision/pretrained/salaad_qkv_s50_alpha1_backbone.pth
  checkpoint_kind: derived_backbone
  sha256: 48b912afc5a91892997ef07fb6da9f5aa811b820cb11720678ed3ca76aa91afa
  source_checkpoint: data/salaad_vision/vit_b8_qkv/20260804_111549/model.pth
  source_matrix_dir: data/salaad_vision/vit_b8_qkv/20260804_111549
  sparse_keep_fraction: 0.5
  selected_energy_fraction: 0.5
  reference_rank: 150
  alpha: 1.0
  attention_backend: sdpa
  freeze: true

data:
  name: voc2012
  dataset: Pascal VOC 2012
  root: ${VOC2012_ROOT}
  image_size: 224
  resize_size: 256
  crop_scale: [0.5, 1.0]
  crop_ratio: [0.75, 1.3333333333333333]
  horizontal_flip_probability: 0.5
  pin_memory: true
  train:
    split: train
    shuffle: true
    drop_last: false
  validation:
    split: val
    shuffle: false
    num_workers: 4
    drop_last: false

training:
  epochs: 100
  batch_size: 64
  num_workers: 8
  precision: bfloat16

optimizer:
  name: sgd
  lr: 0.1
  momentum: 0.9
  weight_decay: 0.0

scheduler:
  name: cosine
  min_lr: 0.0

wandb:
  enabled: true
  project: SALAAD_VISION_DOWNSTREAM
  entity: hao-ma-eth-z-rich
  group: voc2012_segmentation_salaad_qkv_s50_alpha1
  job_type: segmentation_probe

runtime:
  device: cuda
  distributed: auto
  backend: nccl

output:
  save: true
  dir: data/salaad_vision/downstream/voc2012_segmentation/salaad_qkv_s50_alpha1

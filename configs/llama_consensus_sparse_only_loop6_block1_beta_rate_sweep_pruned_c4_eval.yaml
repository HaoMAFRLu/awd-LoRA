seed: 43
seed_for_shuffle: 43

tokenizer_name: t5-base
max_length: 256
precision: bfloat16

data:
  type: text
  name: allenai/c4
  subset: en
  split: validation
  streaming: true

# Match every previous Consensus/Looped comparison exactly.
batch_size: 512
num_eval_batches: 250
num_workers: 0

checkpoints:
  - name: vanilla_reference
    model_config: configs/llama_60m_model.json
    checkpoint: data/looped_transformer/llama_vanilla_60m/20260813_184120/model.pth
    physical_depth: 8
    logical_depth: 8
    num_loops: 1
    blocks_per_loop: 0

  - name: vanilla_looped_loop6_block1
    model_config: data/vanilla_looped_transformer_loop6_block1/llama_vanilla_looped_60m_loop6_block1/20260818_145204/llama_60m_model.json
    checkpoint: data/vanilla_looped_transformer_loop6_block1/llama_vanilla_looped_60m_loop6_block1/20260818_145204/model.pth
    physical_depth: 3
    logical_depth: 8
    num_loops: 6
    blocks_per_loop: 1

  - name: sparse_only_rate0p1_loop6_block1
    model_config: configs/llama_consensus_sparse_only_60m_loop6_block1_model.json
    checkpoint: data/consensus_sparse_only_loop6_block1_beta_rate0p1/llama_consensus_sparse_only_60m_loop6_block1_beta_rate0p1/20260820_085001/model.pth
    consensus_state_directory: data/consensus_sparse_only_loop6_block1_beta_rate0p1/llama_consensus_sparse_only_60m_loop6_block1_beta_rate0p1/20260820_085001
    evaluate_raw: true
    decomposition_variants:
      - name: xhat_plus_s
        components: [shared, sparse]
      - name: xhat_plus_s_pruned_10pct
        components: [shared, sparse]
        sparse_density: 0.10
    physical_depth: 3
    logical_depth: 8
    num_loops: 6
    blocks_per_loop: 1

  - name: sparse_only_rate0p5_loop6_block1
    model_config: configs/llama_consensus_sparse_only_60m_loop6_block1_model.json
    checkpoint: data/consensus_sparse_only_loop6_block1_beta_rate0p5/llama_consensus_sparse_only_60m_loop6_block1_beta_rate0p5/20260820_085003/model.pth
    consensus_state_directory: data/consensus_sparse_only_loop6_block1_beta_rate0p5/llama_consensus_sparse_only_60m_loop6_block1_beta_rate0p5/20260820_085003
    evaluate_raw: true
    decomposition_variants:
      - name: xhat_plus_s
        components: [shared, sparse]
      - name: xhat_plus_s_pruned_10pct
        components: [shared, sparse]
        sparse_density: 0.10
    physical_depth: 3
    logical_depth: 8
    num_loops: 6
    blocks_per_loop: 1

output_directory: data/consensus_salaad_evaluation/sparse_only_loop6_block1_beta_rate_sweep_pruned_c4_seed43

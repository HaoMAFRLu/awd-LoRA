model_type: GPT
seed: 42
training:
  batch_size: 12
  num_epochs: 6000
  num_workers: 4
  dataloader: train_loader
scheduler:
  name: StepLR
  params:
    step_size: 5
    gamma: 0.85
optimizer:
  name: AdamW
  params:
    lr: 0.0006
    weight_decay: 0.1
    betas:
    - 0.9
    - 0.95

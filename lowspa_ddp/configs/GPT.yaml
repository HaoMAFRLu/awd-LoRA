    alpha_to_rho: 0.01
    beta_to_rho: 0.01
    rho: 0.001
    energy: 0.9
    init_energy: 0.3
    iter_max: 1
    tol: 0.001
    loss_version: v1
    is_cal: true
    rate_rank: 0.15
    rate_sparsity: 0.02
    is_adaptive: true
    rate_decay: 0.9

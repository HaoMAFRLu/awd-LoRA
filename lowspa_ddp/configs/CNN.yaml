model_type: CNN
seed: 42
layers:
  - name: fc1.weight
    params:
      alpha_to_rho: 0.01  # Regularization parameter for the layer
      beta_to_rho: 0.01  # Sparsity parameter for the layer
      rho: 0.001  # Penalty parameter for the layer
      energy: 0.9  # Energy parameter for the layer
      init_energy: 0.3  # Initial energy for the layer
      iter_max: 1  # Maximum number of iterations for the layer
      tol: 0.001  # Tolerance for convergence
      loss_version: v1  # Version of the loss function, v1: X - L - S -Y/rho, v2: X - L
      is_cal: True  # Whether to calculate the sparse matrix for this layer
      rate_rank: 0.2  # Rate of rank reduction for the layer
      rate_sparsity: 0.01  # Rate of sparsity for the layer
      is_adaptive: True  # Whether to use adaptive parameters for the layer
      rate_decay: 0.9  # Rate of decay for the adaptive parameters
  - name: fc2.weight
    params:
      alpha_to_rho: 0.01
      beta_to_rho: 0.01
      rho: 0.001
      energy: 0.9
      init_energy: 0.3
      iter_max: 1
      tol: 0.001
      loss_version: v1
      is_cal: True
      rate_rank: 0.2  # Rate of rank reduction for the layer
      rate_sparsity: 0.01  # Rate of sparsity for the layer
      is_adaptive: True  # Whether to use adaptive parameters for the layer
      rate_decay: 0.9  # Rate of decay for the adaptive parameters

training:
  batch_size: 512
  num_epochs: 100
  num_workers: 4
  dataloader: train_loader  

scheduler:
  name: StepLR
  params:
    step_size: 5
    gamma: 0.7

optimizer:
  name: Adam
  params:
    lr: 0.008           
    weight_decay: 0.0
    betas: null    